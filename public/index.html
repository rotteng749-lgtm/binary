<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08060d">
<title>🦊 Kitsune Panel — Key Management</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08060d;
    --text: #f4effc;
    --muted: #a29ac0;
    --fox: #ff7a2f;
    --gold: #ffb13d;
    --pink: #ff3d68;
    --cyan: #45d8ff;
    --green: #3ddc97;
    --red: #ff5d5d;
    --amber: #ffc24b;
    --violet: #b18cff;
    --glass: rgba(21, 16, 34, 0.62);
    --glass2: rgba(32, 24, 52, 0.55);
    --line: rgba(255, 255, 255, 0.08);
    --radius: 16px;
    --font: 'Sora', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    min-height: 100vh;
    background: var(--bg);
  }
  /* static aurora backdrop */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(1000px 600px at 12% -8%, rgba(255, 122, 47, .16), transparent 55%),
      radial-gradient(900px 600px at 105% 12%, rgba(255, 61, 104, .10), transparent 55%),
      radial-gradient(900px 700px at 50% 115%, rgba(123, 92, 255, .10), transparent 60%);
  }
  ::selection { background: rgba(255, 122, 47, .35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2b2340; border-radius: 8px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: #3a2f55; }

  /* ── FX layers ── */
  #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #cursor-glow {
    position: fixed; top: 0; left: 0; width: 420px; height: 420px; z-index: 0;
    pointer-events: none; border-radius: 50%; will-change: transform;
    background: radial-gradient(circle, rgba(255, 122, 47, .14), rgba(255, 177, 61, .05) 42%, transparent 66%);
  }
  @media (hover: none), (pointer: coarse) { #cursor-glow { display: none; } }

  .layout, #modal-root, #toast-root { position: relative; z-index: 2; }

  /* ── Layout ── */
  .layout { display: flex; min-height: 100vh; }
  .sidebar {
    width: 240px; flex-shrink: 0;
    background: var(--glass);
    backdrop-filter: blur(16px) saturate(150%);
    -webkit-backdrop-filter: blur(16px) saturate(150%);
    border-right: 1px solid var(--line);
    padding: 22px 14px;
    display: flex; flex-direction: column; gap: 6px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 2px 8px 20px; }
  .brand .logo {
    width: 40px; height: 40px; border-radius: 12px; font-size: 20px;
    background: linear-gradient(135deg, var(--fox), var(--gold));
    display: grid; place-items: center;
    box-shadow: 0 0 26px rgba(255, 122, 47, .45);
    animation: floaty 4.5s ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
  .brand b {
    font-size: 1.1rem; letter-spacing: .09em; font-weight: 800;
    background: linear-gradient(90deg, #fff, #ffd9a8);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand small { display: block; color: var(--muted); font-size: .66rem; font-weight: 400; letter-spacing: .04em; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    background: none; border: 1px solid transparent; color: var(--muted);
    padding: 11px 13px; border-radius: 11px; cursor: pointer;
    font-size: .88rem; font-family: inherit; transition: all .18s;
  }
  .nav-item:hover { color: var(--text); background: var(--glass2); }
  .nav-item.active {
    color: #fff;
    background: linear-gradient(90deg, rgba(255, 122, 47, .20), rgba(255, 177, 61, .07));
    border-color: rgba(255, 122, 47, .38);
    box-shadow: inset 3px 0 0 var(--fox), 0 4px 18px rgba(255, 122, 47, .12);
  }
  .side-spacer { flex: 1; }
  .user-card {
    background: var(--glass2); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px;
    display: flex; flex-direction: column; gap: 9px;
  }
  .user-row { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--fox), var(--pink));
    display: grid; place-items: center; font-weight: 700; font-size: .85rem; color: #fff;
    box-shadow: 0 0 16px rgba(255, 122, 47, .35);
  }
  .user-name { font-weight: 600; font-size: .88rem; line-height: 1.15; word-break: break-all; }
  .user-sub { font-size: .7rem; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    font-size: .72rem; padding: 4px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--muted);
  }
  .chip b { color: var(--gold); }

  .main { flex: 1; padding: 28px 32px 64px; min-width: 0; }
  .page-head { margin-bottom: 22px; }
  .page-head h1 {
    font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em;
    background: linear-gradient(90deg, #fff, #ffd9a8 55%, #ff9a5c);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .page-head p { color: var(--muted); font-size: .84rem; margin-top: 5px; }

  /* ── Cards / stats ── */
  .card {
    position: relative; overflow: hidden;
    background: var(--glass);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid var(--line);
    border-radius: var(--radius); padding: 19px; margin-bottom: 16px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, .35);
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 12%; right: 12%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255, 177, 61, .45), transparent);
  }
  .card h2 { font-size: .93rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat {
    position: relative; overflow: hidden;
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: var(--radius); padding: 17px;
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .stat:hover {
    transform: translateY(-3px);
    border-color: rgba(255, 177, 61, .30);
    box-shadow: 0 12px 34px rgba(255, 122, 47, .14);
  }
  .stat .n { font-size: 1.75rem; font-weight: 800; }
  .stat .l { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; margin-top: 3px; }
  .stat.fox .n, .stat.violet .n { background: linear-gradient(135deg, var(--fox), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stat.green .n { color: var(--green); }
  .stat.red .n { color: var(--red); }
  .stat.amber .n { color: var(--amber); }
  .stat.cyan .n { color: var(--cyan); }

  /* ── Forms ── */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  label { display: block; font-size: .7rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .07em; }
  input, select, textarea {
    width: 100%; background: rgba(10, 8, 18, .55); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 13px; font-size: .87rem; font-family: inherit; outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: rgba(255, 122, 47, .60);
    box-shadow: 0 0 0 3px rgba(255, 122, 47, .14);
  }
  textarea { resize: vertical; min-height: 90px; font-family: ui-monospace, 'JetBrains Mono', monospace; }
  .checkbox-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkbox-row label {
    display: inline-flex; align-items: center; gap: 6px; margin: 0;
    background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 11px; font-size: .78rem; text-transform: none; letter-spacing: 0; cursor: pointer; color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .checkbox-row label:hover { border-color: rgba(255, 122, 47, .4); }
  .checkbox-row input { width: auto; accent-color: var(--fox); }

  /* ── Buttons ── */
  .btn {
    background: linear-gradient(135deg, var(--fox), var(--gold));
    color: #1a0d02; border: none; padding: 11px 19px; border-radius: 10px;
    font-weight: 700; font-size: .84rem; cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 20px rgba(255, 122, 47, .30);
    transition: filter .15s, box-shadow .2s, transform .1s;
  }
  .btn:hover { filter: brightness(1.08); box-shadow: 0 8px 28px rgba(255, 122, 47, .45); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line);
    color: var(--muted); box-shadow: none;
  }
  .btn.ghost:hover { color: var(--text); border-color: rgba(255, 177, 61, .45); filter: none; }
  .btn.danger { background: linear-gradient(135deg, #ff5d5d, #d63a5e); color: #fff; box-shadow: 0 6px 20px rgba(255, 93, 93, .25); }
  .btn.danger:hover { box-shadow: 0 8px 26px rgba(255, 93, 93, .4); }
  .btn.small { padding: 5px 10px; font-size: .74rem; border-radius: 8px; }
  .btn.wfull { width: 100%; }
  .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-btns .btn { padding: 4px 9px; font-size: .71rem; border-radius: 7px; }

  /* ── Tables ── */
  .tbl-wrap { overflow-x: auto; border-radius: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .83rem; }
  th {
    text-align: left; padding: 11px 12px; color: var(--muted);
    font-size: .66rem; text-transform: uppercase; letter-spacing: .09em;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 11px 12px; border-bottom: 1px solid rgba(255, 255, 255, .045); vertical-align: middle; }
  tr:hover td { background: rgba(255, 122, 47, .05); }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: .79rem; }
  .key-text { color: var(--gold); cursor: pointer; }
  .key-text:hover { text-decoration: underline; text-decoration-color: rgba(255, 177, 61, .5); }
  .muted { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 36px 10px !important; }

  /* ── Badges ── */
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: .67rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    border: 1px solid transparent;
  }
  .badge.ok { background: rgba(61, 220, 151, .12); color: var(--green); border-color: rgba(61, 220, 151, .25); }
  .badge.bad { background: rgba(255, 93, 93, .12); color: var(--red); border-color: rgba(255, 93, 93, .28); }
  .badge.warn { background: rgba(255, 194, 75, .12); color: var(--amber); border-color: rgba(255, 194, 75, .28); }
  .badge.muted { background: rgba(162, 154, 192, .10); color: var(--muted); border-color: rgba(162, 154, 192, .22); }
  .badge.violet { background: rgba(177, 140, 255, .12); color: var(--violet); border-color: rgba(177, 140, 255, .28); }
  .badge.cyan { background: rgba(69, 216, 255, .10); color: var(--cyan); border-color: rgba(69, 216, 255, .26); }
  .badge.orange { background: rgba(255, 122, 47, .13); color: var(--fox); border-color: rgba(255, 122, 47, .32); }

  /* ── Modal ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(4, 3, 8, .70);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 50;
    display: grid; place-items: center; padding: 18px;
    animation: fadeIn .18s ease;
  }
  .modal {
    width: 100%; max-width: 530px; max-height: 86vh; overflow-y: auto;
    background: var(--glass);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border: 1px solid rgba(255, 177, 61, .16);
    border-radius: 18px; padding: 22px;
    box-shadow: 0 30px 90px rgba(0, 0, 0, .6), 0 0 60px rgba(255, 122, 47, .07);
    animation: popIn .2s cubic-bezier(.2, .9, .3, 1.2);
  }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(8px); } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head h3 { font-size: .98rem; }
  .modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .icon-btn {
    background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--muted);
    width: 30px; height: 30px; border-radius: 9px; cursor: pointer; font-size: .85rem;
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: rgba(255, 177, 61, .45); }
  .key-output {
    font-family: ui-monospace, 'JetBrains Mono', monospace; font-size: .82rem;
    background: rgba(10, 8, 18, .55); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 13px; margin-top: 8px; color: var(--gold); word-break: break-all;
  }

  /* ── Toasts ── */
  #toast-root { position: fixed; right: 18px; bottom: 18px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-left: 3px solid var(--green);
    padding: 12px 16px; border-radius: 11px; font-size: .83rem;
    box-shadow: 0 14px 40px rgba(0, 0, 0, .5);
    animation: slidein .22s ease; max-width: 340px;
  }
  .toast.error { border-left-color: var(--red); }
  @keyframes slidein { from { opacity: 0; transform: translateX(14px); } }

  /* ── Login ── */
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; position: relative; }
  .login-wrap::before, .login-wrap::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(75px); opacity: .55; z-index: 0;
    animation: drift 13s ease-in-out infinite alternate; pointer-events: none;
  }
  .login-wrap::before { width: 340px; height: 340px; background: rgba(255, 122, 47, .20); top: 10%; left: 12%; }
  .login-wrap::after { width: 300px; height: 300px; background: rgba(123, 92, 255, .20); bottom: 8%; right: 10%; animation-delay: -6.5s; }
  @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(46px, -34px); } }
  .login-card {
    width: 100%; max-width: 390px; position: relative; z-index: 1;
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255, 177, 61, .15);
    border-radius: 22px; padding: 34px 28px;
    box-shadow: 0 34px 90px rgba(0, 0, 0, .55), 0 0 80px rgba(255, 122, 47, .08);
    animation: popIn .35s cubic-bezier(.2, .9, .3, 1.15);
  }
  .login-card .brand { justify-content: center; padding-bottom: 6px; }
  .login-card .logo { width: 58px; height: 58px; font-size: 28px; border-radius: 16px; margin: 0 auto; animation: foxPulse 2.6s ease-in-out infinite; }
  .login-card .brand { flex-direction: column; gap: 12px; }
  .login-card .brand b { font-size: 1.45rem; text-align: center; }
  .login-card .brand small { text-align: center; }
  @keyframes foxPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 122, 47, .40), 0 0 30px rgba(255, 122, 47, .35); }
    60% { box-shadow: 0 0 0 20px rgba(255, 122, 47, 0), 0 0 44px rgba(255, 122, 47, .5); }
  }
  .login-sub { text-align: center; color: var(--muted); font-size: .8rem; margin-bottom: 22px; }
  .login-card label { margin-top: 13px; }
  .login-card .btn { margin-top: 22px; }
  .login-err {
    display: none; margin-top: 12px; font-size: .8rem; color: var(--red);
    background: rgba(255, 93, 93, .09); border: 1px solid rgba(255, 93, 93, .30);
    padding: 9px 12px; border-radius: 9px;
  }
  .device-hint { text-align: center; color: var(--muted); font-size: .67rem; margin-top: 16px; word-break: break-all; }

  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .bulk-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    background: rgba(255, 122, 47, .06); border: 1px dashed rgba(255, 122, 47, .30);
    border-radius: 10px; padding: 9px 12px; margin-bottom: 12px;
  }
  .bulk-bar .btn { padding: 5px 11px; font-size: .74rem; }
  .pagination { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
  .pagination .btn[disabled] { opacity: .35; cursor: not-allowed; }
  .topup-row { display: flex; gap: 8px; }
  .topup-row select { flex: 1; }
  .topup-row input { width: 90px; }
  .per-game-row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: .82rem; }
  .per-game-bar { flex: 1; height: 8px; background: rgba(255, 255, 255, .05); border-radius: 99px; overflow: hidden; }
  .per-game-fill { height: 100%; background: linear-gradient(90deg, var(--fox), var(--gold)); border-radius: 99px; box-shadow: 0 0 12px rgba(255, 122, 47, .5); }

  /* ── Responsive ── */
  @media (max-width: 900px) {
    .layout { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto; position: static;
      flex-direction: row; align-items: center; flex-wrap: wrap; gap: 8px;
      border-right: none; border-bottom: 1px solid var(--line);
      padding: 14px;
    }
    .brand { padding: 0 6px; }
    .brand small { display: none; }
    .nav-item { width: auto; padding: 9px 12px; }
    .side-spacer { display: none; }
    .user-card { flex-direction: row; align-items: center; margin-left: auto; padding: 8px 11px; gap: 8px; }
    .user-card .chip { display: none; }
    .main { padding: 20px 14px 54px; }
    .filters { grid-template-columns: 1fr; }
    .page-head h1 { font-size: 1.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div id="cursor-glow" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script>
    /* ── Kitsune foxfire: ambient embers + cursor-following sparks ── */
    (function () {
      var canvas = document.getElementById('bg-canvas');
      var glow = document.getElementById('cursor-glow');
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        if (canvas) canvas.style.display = 'none';
        if (glow) glow.style.display = 'none';
        return;
      }
      var ctx = canvas.getContext('2d');
      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      var W = 0, H = 0;

      function resize() {
        W = canvas.width = Math.floor(innerWidth * DPR);
        H = canvas.height = Math.floor(innerHeight * DPR);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
      }
      resize();
      addEventListener('resize', resize);

      var COLORS = ['#ff7a2f', '#ffb13d', '#ff3d68', '#ffd98a', '#b18cff'];
      var parts = [];

      var AMBIENT = Math.max(24, Math.min(60, Math.floor(innerWidth / 24)));
      function makeAmbient(randomY) {
        return {
          kind: 'a',
          x: Math.random() * innerWidth * DPR,
          y: (randomY ? Math.random() * innerHeight : innerHeight + 20) * DPR,
          r: (Math.random() * 1.8 + 0.7) * DPR,
          vy: -(Math.random() * 0.28 + 0.08) * DPR,
          vx: (Math.random() - 0.5) * 0.18 * DPR,
          c: COLORS[(Math.random() * COLORS.length) | 0],
          phase: Math.random() * 6.283,
          tws: Math.random() * 0.02 + 0.006,
          life: 1
        };
      }
      for (var i = 0; i < AMBIENT; i++) parts.push(makeAmbient(true));

      var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
      var mx = null, my = null, mxG = innerWidth / 2, myG = innerHeight / 2;
      var gx = mxG, gy = myG, lastEmit = 0;

      if (fine) {
        addEventListener('mousemove', function (e) {
          mxG = e.clientX; myG = e.clientY;
          mx = e.clientX * DPR; my = e.clientY * DPR;
          var now = performance.now();
          if (now - lastEmit > 26 && parts.length < 160) {
            lastEmit = now;
            parts.push({
              kind: 'e',
              x: mx + (Math.random() - 0.5) * 20 * DPR,
              y: my + (Math.random() - 0.5) * 20 * DPR,
              r: (Math.random() * 1.6 + 0.5) * DPR,
              vy: -(Math.random() * 0.6 + 0.25) * DPR,
              vx: (Math.random() - 0.5) * 0.5 * DPR,
              c: COLORS[(Math.random() * COLORS.length) | 0],
              life: 1,
              decay: Math.random() * 0.02 + 0.015
            });
          }
        }, { passive: true });
      }

      function tick(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (var i = parts.length - 1; i >= 0; i--) {
          var p = parts[i];
          p.x += p.vx; p.y += p.vy;
          if (p.kind === 'e') {
            p.life -= p.decay;
            if (p.life <= 0) { parts.splice(i, 1); continue; }
          } else {
            if (p.y < -30 * DPR) { p.y = H + 20 * DPR; p.x = Math.random() * W; }
            if (p.x < -30) p.x = W + 20; else if (p.x > W + 30) p.x = -20;
          }
          ctx.globalAlpha = p.kind === 'e'
            ? p.life * 0.85
            : 0.15 + 0.30 * Math.abs(Math.sin(t * p.tws + p.phase));
          ctx.fillStyle = p.c;
          ctx.shadowColor = p.c;
          ctx.shadowBlur = 8 * DPR;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'source-over';

        if (fine && glow && mx !== null) {
          gx += (mxG - gx) * 0.07;
          gy += (myG - gy) * 0.07;
          glow.style.transform = 'translate(' + (gx - 210) + 'px,' + (gy - 210) + 'px)';
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
  <script src="./app.js"></script>
</body>
</html>
